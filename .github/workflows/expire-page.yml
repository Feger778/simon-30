name: Geburtstagsseite nach zwei Monaten ausblenden
on:
  schedule:
    - cron: "5 0 21 1 *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expire:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.run_started_at != '')
    runs-on: ubuntu-latest
    steps:
      - name: Seite am 21. Januar 2027 durch Ablaufhinweis ersetzen
        if: github.event_name == 'workflow_dispatch' || startsWith(github.run_started_at, '2027-01-21')
        uses: actions/github-script@v7
        with:
          script: |
            const path = 'index.html';
            const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path});
            const content = Buffer.from(`<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Danke, Simon!</title><body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#171326;color:#fff;font:20px system-ui;text-align:center"><main style="padding:32px"><h1>🎉 Danke für die schönen Erinnerungen, Simon!</h1><p>Diese Geburtstagsseite ist wie angekündigt nicht mehr verfügbar.</p></main></body></html>`).toString('base64');
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo, path,
              message: 'Geburtstagsseite nach zwei Monaten ausblenden',
              sha: current.data.sha, content
            });
